<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Canal vertebral, médula y raíces: vistas separadas</title><desc id="desc">Vista sagital con médula continua paralela a cuerpos vertebrales; detalle transversal independiente de meninges y raíces. Dorsal arriba y ventral abajo en el detalle.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#244d51" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203c40;font-size:23px} .small{font-size:20px;fill:#50676a}.head{font-size:30px;font-weight:700}.label{font-weight:700}.line{fill:none;stroke:#50676a;stroke-width:2}.bone{fill:#eadbc0;stroke:#9e8662;stroke-width:3}</style><rect width="1200" height="1500" fill="#faf9f3"/><text x="55" y="60" class="small">MÉDULA ATLAS · LÁMINA DE REVISIÓN</text><text x="55" y="110" font-size="40" font-weight="700">Canal vertebral y meninges</text><text x="55" y="148">Dos vistas independientes para leer tres dimensiones.</text><rect x="35" y="185" width="1130" height="555" rx="22" fill="white" stroke="#d8dfd7"/><text x="60" y="230" class="head">A / Continuidad craneocaudal</text><text x="60" y="264" class="small">Esquema sagital torácico · raíces omitidas en esta vista</text><text x="120" y="314" class="label">VENTRAL / anterior</text><text x="770" y="314" class="label">DORSAL / posterior</text><rect x="480" y="340" width="170" height="310" rx="20" fill="#f4ead0"/><rect x="505" y="330" width="120" height="330" rx="8" fill="#e1f0ed" stroke="#526c80" stroke-width="6"/><rect x="544" y="325" width="42" height="340" fill="#d9927b" stroke="#98624e" stroke-width="3"/><rect x="300" y="345" width="175" height="82" rx="12" class="bone"/><path d="M655 350L700 350L815 410L800 425L690 400L655 400Z" class="bone"/><rect x="300" y="450" width="175" height="82" rx="12" class="bone"/><path d="M655 455L700 455L815 515L800 530L690 505L655 505Z" class="bone"/><rect x="300" y="555" width="175" height="82" rx="12" class="bone"/><path d="M655 560L700 560L815 620L800 635L690 610L655 610Z" class="bone"/><rect x="307" y="430" width="160" height="14" rx="5" fill="#a8c1c6"/><rect x="307" y="535" width="160" height="14" rx="5" fill="#a8c1c6"/><path d="M245 355V645" stroke="#244d51" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="70" y="372">Craneal ↑</text><text x="70" y="630">Caudal ↓</text><text x="70" y="490" class="small">Cuerpos</text><text x="70" y="516" class="small">vertebrales</text><path d="M200 495H300" class="line"/><text x="845" y="390">Arco posterior</text><path d="M840 397L720 390" class="line"/><text x="845" y="470">Canal vert.</text><path d="M835 465L637 487" class="line"/><text x="845" y="550">Médula continua</text><path d="M835 545L566 532" class="line"/><text x="300" y="703" class="small">No se asignan números: nivel vertebral ≠ segmento medular.</text><rect x="35" y="765" width="1130" height="560" rx="22" fill="white" stroke="#d8dfd7"/><text x="60" y="810" class="head">B / Corte transversal independiente</text><text x="60" y="843" class="small">Ampliación conceptual · hueso y vainas radiculares omitidos · un solo lado</text><text x="265" y="884" class="label">DORSAL / posterior</text><ellipse cx="380" cy="1070" rx="228" ry="165" fill="#f4ead0"/><ellipse cx="380" cy="1070" rx="193" ry="138" fill="#dff0ee" stroke="#526c80" stroke-width="9"/><ellipse cx="380" cy="1070" rx="185" ry="130" fill="none" stroke="#4e9c96" stroke-width="3"/><ellipse cx="380" cy="1070" rx="113" ry="90" fill="#fff8e9" stroke="#ac5b63" stroke-width="4"/><path d="M380 1055C350 1050 342 1015 322 1005C315 1024 336 1042 335 1060C305 1078 314 1108 340 1108C361 1108 364 1085 380 1084C396 1085 399 1108 420 1108C446 1108 455 1078 425 1060C424 1042 445 1024 438 1005C418 1015 410 1050 380 1055Z" fill="#d9927b"/><circle cx="380" cy="1070" r="4" fill="#fff"/><path d="M380 1160V1125" class="line"/><path d="M470 1020C530 1015 545 989 605 995S670 1015 699 1060" fill="none" stroke="#328e89" stroke-width="9"/><ellipse cx="607" cy="996" rx="29" ry="16" fill="#86c3b1" stroke="#286d69" stroke-width="3"/><path d="M467 1114C550 1150 620 1135 699 1060" fill="none" stroke="#bb7939" stroke-width="9"/><path d="M699 1060H780" stroke="#8d713b" stroke-width="12"/><text x="790" y="1068">Nervio mixto</text><text x="760" y="928" fill="#286d69">Raíz dorsal · sensitiva</text><path d="M750 935L550 1000" class="line"/><text x="760" y="987">Ganglio sensitivo</text><path d="M748 990L636 996" class="line"/><text x="760" y="1152">Raíz ventral · motora</text><text x="760" y="1182" class="small">Sin ganglio sensitivo</text><path d="M750 1140L610 1128" class="line"/><text x="265" y="1280" class="label">VENTRAL / anterior</text><text x="70" y="1370" class="small">Cubiertas, de dentro afuera: pia → espacio subaracnoideo (LCR) →</text><text x="70" y="1400" class="small">aracnoides → dura → espacio epidural (grasa y plexos venosos).</text><text x="70" y="1440" class="small">Esquema original. Espacio subdural potencial: no se dibuja como cavidad abierta.</text><text x="70" y="1470" class="small">Fuentes: OpenStax A&amp;P 2e §§7.3, 13.3 y 13.4 · Revisión experta pendiente.</text><circle cx="267" cy="1070" r="13" fill="white" stroke="#203c40"/><text x="267" y="1076" text-anchor="middle" font-size="18">1</text><circle cx="240" cy="1090" r="13" fill="white" stroke="#203c40"/><text x="240" y="1096" text-anchor="middle" font-size="18">2</text><circle cx="202" cy="1115" r="13" fill="white" stroke="#203c40"/><text x="202" y="1121" text-anchor="middle" font-size="18">3</text><circle cx="191" cy="1040" r="13" fill="white" stroke="#203c40"/><text x="191" y="1046" text-anchor="middle" font-size="18">4</text><circle cx="150" cy="1000" r="13" fill="white" stroke="#203c40"/><text x="150" y="1006" text-anchor="middle" font-size="18">5</text><path d="M159 1009L173 1040" class="line"/><text x="670" y="1230" class="small">1 Pia · 2 LCR · 3 Aracnoides</text><text x="670" y="1260" class="small">4 Dura · 5 Espacio epidural</text></svg>